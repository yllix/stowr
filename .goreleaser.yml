version: 2

project_name: stowr

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/yllix/stowr/v3/version.Version={{ .Version }} -X github.com/yllix/stowr/v3/version.CommitSHA={{ .ShortCommit }}
    main: main.go
    binary: stowr
    # Kept to the platforms people actually run: x86-64 and ARM servers,
    # NAS boxes and Raspberry Pis, plus Mac and Windows desktops.
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

dockers:
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/yllix/stowr:{{ .Tag }}-amd64"
      - "ghcr.io/yllix/stowr:v{{ .Major }}-amd64"
    extra_files:
      - docker
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/arm64"
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/yllix/stowr:{{ .Tag }}-arm64"
      - "ghcr.io/yllix/stowr:v{{ .Major }}-arm64"
    extra_files:
      - docker
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/arm/v7"
    goos: linux
    goarch: arm
    goarm: "7"
    image_templates:
      - "ghcr.io/yllix/stowr:{{ .Tag }}-armv7"
      - "ghcr.io/yllix/stowr:v{{ .Major }}-armv7"
    extra_files:
      - docker

docker_manifests:
  - name_template: "ghcr.io/yllix/stowr:latest"
    # Release candidates must not move the floating tags.
    skip_push: auto
    image_templates:
      - "ghcr.io/yllix/stowr:{{ .Tag }}-amd64"
      - "ghcr.io/yllix/stowr:{{ .Tag }}-arm64"
      - "ghcr.io/yllix/stowr:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/yllix/stowr:{{ .Tag }}"
    image_templates:
      - "ghcr.io/yllix/stowr:{{ .Tag }}-amd64"
      - "ghcr.io/yllix/stowr:{{ .Tag }}-arm64"
      - "ghcr.io/yllix/stowr:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/yllix/stowr:v{{ .Major }}"
    # Release candidates must not move the floating tags.
    skip_push: auto
    image_templates:
      - "ghcr.io/yllix/stowr:v{{ .Major }}-amd64"
      - "ghcr.io/yllix/stowr:v{{ .Major }}-arm64"
      - "ghcr.io/yllix/stowr:v{{ .Major }}-armv7"

release:
  # Tags like v3.0.0-rc.1 are published as pre-releases.
  prerelease: auto
